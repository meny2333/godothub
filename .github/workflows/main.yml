name: Godothub Export

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example, v1.0.0-test)
        required: true
        default: v1.0.0-test
      prerelease:
        description: Mark the GitHub release as a prerelease
        type: boolean
        default: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  export_game:
    runs-on: ubuntu-latest
    name: Export Game Job
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Wine
        id: wine_install
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32
          echo "WINE_PATH=$(which wine)" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias godothub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass godothub123 -keypass godothub123 \
            -dname "CN=Godothub, OU=Godothub, O=Godothub, L=City, ST=State, C=US"

      - name: Export Game
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          archive_output: true
          wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}
          presets_to_export: Windows Desktop,Linux/X11,Web,Android

      - name: Create Release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
